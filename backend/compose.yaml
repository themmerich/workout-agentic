# Explicit project name: without it Compose derives the project from the
# directory name ("backend"), sharing containers — and their database state —
# with every other checkout whose backend lives in a "backend" folder.
name: workout

services:
  postgres:
    # Major version pinned; keep in sync with TestcontainersConfiguration.
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=workout'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=workout'
    # Fixed host port so database tools can connect; 5435 rather than 5432 to
    # stay clear of other local Postgres instances on 5432–5434.
    ports:
      - '5435:5432'
